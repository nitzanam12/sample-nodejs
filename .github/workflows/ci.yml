name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'infra/**'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: SAST
        run: pipx run --spec semgrep==1.181.1 semgrep scan --config p/default --severity ERROR --error .

      - name: Build image
        run: docker build --pull -t sample-nodejs:${{ github.sha }} .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sample-nodejs:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: 'false'

      - name: Save scanned image
        if: github.event_name == 'push'
        run: docker save sample-nodejs:${{ github.sha }} | gzip -1 > "$RUNNER_TEMP/image.tar.gz"

      - name: Upload image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    concurrency:
      group: sample-nodejs-release
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Download scanned image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "$RUNNER_TEMP/image.tar.gz"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::848349338166:role/sample-nodejs-github-ecr
          aws-region: eu-north-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push SHA image
        env:
          ECR: 848349338166.dkr.ecr.eu-north-1.amazonaws.com/sample-nodejs
        run: |
          existing=$(aws ecr batch-get-image --repository-name sample-nodejs \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'images[0].imageId.imageTag' --output text)

          if [[ "$existing" != "$GITHUB_SHA" ]]; then
            docker tag "sample-nodejs:$GITHUB_SHA" "$ECR:$GITHUB_SHA"
            docker push "$ECR:$GITHUB_SHA"
          fi

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ECR: 848349338166.dkr.ecr.eu-north-1.amazonaws.com/sample-nodejs
        run: |
          npx --yes --package=semantic-release@25.0.9 \
            --package=@semantic-release/exec@7.1.0 semantic-release

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: nitzanam12
          repositories: sample-nodejs-gitops
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nitzanam12/sample-nodejs-gitops
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Update GitOps image tag
        run: |
          sed -i "s/^  tag: .*/  tag: \"$GITHUB_SHA\"/" gitops/helm/sample-nodejs/values.yaml
          grep -q "tag: \"$GITHUB_SHA\"" gitops/helm/sample-nodejs/values.yaml

      - name: Create GitOps pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          base: main
          branch: automation/update-image
          add-paths: helm/sample-nodejs/values.yaml
          commit-message: "chore: update image to ${{ github.sha }}"
          title: "chore: update image to ${{ github.sha }}"
          body: "Automated image update after successful CI."
          delete-branch: true